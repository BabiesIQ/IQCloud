<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
<title id="title">BabiesIQ Cloud - explore, configure, begin, manage</title>
<desc id="description">An animated diagram of the customer journey through the website.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#0a3030"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4bedbf"/><stop offset="1" stop-color="#6bbdf5"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000b10" flood-opacity=".55"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#60e4d3" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="280" rx="23" fill="url(#bg)" stroke="#3cb4a2" stroke-opacity=".36"/>
<text x="36" y="39" font-size="16" font-weight="700" font-family="Arial,DejaVu Sans,sans-serif" fill="#80f8d9">YOUR CLOUD JOURNEY</text>
<text x="36" y="61" font-size="12" font-family="Arial,DejaVu Sans,sans-serif" fill="#a8cbd0">A clear, simple experience from discovering plans to managing your services</text>
<g filter="url(#shadow)" fill="#0d2732" stroke="#45cbb6" stroke-opacity=".85">
<rect x="36" y="93" width="242" height="125" rx="17"/><rect x="351" y="93" width="242" height="125" rx="17"/><rect x="666" y="93" width="242" height="125" rx="17"/><rect x="981" y="93" width="184" height="125" rx="17"/></g>
<g font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#effffb">
<text x="58" y="130">01  ◇  Explore</text><text x="372" y="130">02  ◇  Configure</text><text x="687" y="130">03  ◇  Begin</text><text x="999" y="130">04  ◇  Manage</text></g>
<g font-family="Arial,DejaVu Sans,sans-serif" font-size="12.5" fill="#a4ccd0">
<text x="58" y="160">Compare plans</text><text x="58" y="183">Review offerings</text>
<text x="372" y="160">Choose preferences</text><text x="372" y="183">Review terms</text>
<text x="687" y="160">Follow instructions</text><text x="687" y="183">Get started</text>
<text x="999" y="160">Your dashboard</text><text x="999" y="183">Support</text></g>
<path d="M282 155H343M597 155H658M912 155H972" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="4s" repeatCount="indefinite"/></path>
<text x="600" y="251" text-anchor="middle" font-size="12" font-family="Arial,DejaVu Sans,sans-serif" fill="#85b9bb">BabiesIQ Cloud · Customer experience illustration</text>
</svg>
 <rect x="35" y="35" width="78" height="29" rx="9" fill="#092e39" stroke="#3ef0cf" stroke-width="2.5"/>
 <path d="M45 45H72 M45 53H65" stroke="#8cf7e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="100" cy="49" r="4" fill="#25f5ba"><animate attributeName="opacity" values="1;.38;1" dur="2.2s" repeatCount="indefinite"/></circle>
 <path d="M53 78V94M91 78V94" stroke="#2ff3c4" stroke-width="4" stroke-linecap="round"/><circle cx="53" cy="97" r="5" fill="#3af9cd"/><circle cx="91" cy="97" r="5" fill="#3af9cd"/>
 <ellipse cx="74" cy="48" rx="77" ry="35" transform="rotate(-13 74 48)" fill="none" stroke="#18f3c9" stroke-width="2.5" opacity=".46"><animateTransform attributeName="transform" type="rotate" values="-13 74 48;-5 74 48;-13 74 48" dur="9s" repeatCount="indefinite"/></ellipse>
</g>
<text x="242" y="100" font-size="48" font-weight="800" font-family="Arial,DejaVu Sans,sans-serif" fill="#ecfffb" letter-spacing="-1.6">BabiesIQ <tspan fill="url(#mint)">Cloud</tspan></text>
<text x="73" y="191" font-size="52" font-weight="800" font-family="Arial,DejaVu Sans,sans-serif" fill="#eafff9" letter-spacing="-2">Your cloud.</text>

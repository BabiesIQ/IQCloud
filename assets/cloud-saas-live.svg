<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">BabiesIQ Cloud — animated SaaS workspace banner</title>
<desc id="desc">Animated emerald and cyan BabiesIQ Cloud banner with a cloud, live portal badge, application dashboard and public API address. This is a conceptual interface illustration, not live operational metrics.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050e19"/><stop offset=".52" stop-color="#071a26"/><stop offset="1" stop-color="#03282b"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75f6da"><animate attributeName="stop-color" values="#75f6da;#5cbdff;#75f6da" dur="7s" repeatCount="indefinite"/></stop><stop offset=".52" stop-color="#25d9b5"/><stop offset="1" stop-color="#84dbff"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffffff"/><stop offset=".36" stop-color="#d7ecf7"/><stop offset=".69" stop-color="#81abbd"/><stop offset="1" stop-color="#33566b"/></linearGradient>
 <linearGradient id="pane" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#101f32"/><stop offset="1" stop-color="#0a3035"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#11e9c3" stop-opacity=".25"/><stop offset="1" stop-color="#11e9c3" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="19" flood-color="#01090f" flood-opacity=".65"/></filter>
 <clipPath id="clip"><rect x="0" y="0" width="1200" height="470" rx="28"/></clipPath>
 <pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#84e8e5" opacity=".10"/></pattern>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="470" fill="url(#base)"/>
<rect width="1200" height="470" fill="url(#dots)"/>
<circle cx="96" cy="82" r="260" fill="url(#glow)"/>
<circle cx="1090" cy="395" r="330" fill="url(#glow)" opacity=".65"/>
<path d="M-35 376 Q215 275 450 408 T1235 312" fill="none" stroke="#1af6ce" stroke-width="2" opacity=".29" stroke-dasharray="8 15"><animate attributeName="stroke-dashoffset" values="0;-135" dur="11s" repeatCount="indefinite"/></path>
<path d="M-30 396 Q260 330 460 424 T1230 360" fill="none" stroke="#53a8ff" stroke-width="1.3" opacity=".23" stroke-dasharray="4 13"><animate attributeName="stroke-dashoffset" values="0;170" dur="13s" repeatCount="indefinite"/></path>
<g opacity=".2" stroke="#60c7ca" stroke-width="1"><path d="M0 90H1200 M0 180H1200 M0 270H1200 M0 360H1200 M100 0V470 M200 0V470 M300 0V470 M400 0V470 M500 0V470 M600 0V470 M700 0V470 M800 0V470 M900 0V470 M1000 0V470 M1100 0V470" opacity=".21"/></g>
<rect x="1.5" y="1.5" width="1197" height="467" rx="27" fill="none" stroke="#55e8d1" stroke-width="1.5" stroke-opacity=".33"/>
<!-- cloud brand mark -->
<g transform="translate(71 57)" filter="url(#shadow)">

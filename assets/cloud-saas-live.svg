</g>
<text x="76" y="406" fill="#70f3d4" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700">cloud.babiesiq.tech</text>
<text x="76" y="429" fill="#91b9c2" font-size="13" font-family="Arial,DejaVu Sans,sans-serif">API  ·  api.cloud.babiesiq.tech</text>

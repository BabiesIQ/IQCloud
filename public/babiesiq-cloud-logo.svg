<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">BabiesIQ Cloud</title>
  <desc id="logoDesc">Silver three-dimensional cloud enclosing three servers, with an emerald orbital ring and connected nodes</desc>
  <defs>
    <linearGradient id="silver" x1=".12" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcffff"/><stop offset=".22" stop-color="#d8ecfa"/><stop offset=".46" stop-color="#f2fbff"/><stop offset=".69" stop-color="#9cb8cd"/><stop offset="1" stop-color="#486a7a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#fff"/><stop offset=".25" stop-color="#e7f8ff"/><stop offset=".48" stop-color="#bfd9e9"/><stop offset=".72" stop-color="#7298ab"/><stop offset="1" stop-color="#244e5b"/>
    </linearGradient>
    <linearGradient id="well" x1=".2" y1="0" x2=".85" y2="1">
      <stop stop-color="#1c4854"/><stop offset=".4" stop-color="#092e34"/><stop offset=".8" stop-color="#012922"/><stop offset="1" stop-color="#047e67"/>
    </linearGradient>
    <linearGradient id="server" x1=".1" y1="0" x2=".95" y2="1">
      <stop stop-color="#fff"/><stop offset=".24" stop-color="#e1f1fe"/><stop offset=".53" stop-color="#91b8d0"/><stop offset=".82" stop-color="#416879"/><stop offset="1" stop-color="#0c4550"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#506f7c"/><stop offset=".28" stop-color="#203b47"/><stop offset="1" stop-color="#072b32"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#00b78d"/><stop offset=".34" stop-color="#10ffb7"/><stop offset=".7" stop-color="#92fff4"/><stop offset="1" stop-color="#00ceb0"/>
    </linearGradient>
    <radialGradient id="orb" cx=".3" cy=".2" r=".8">
      <stop stop-color="#b5fff5"/><stop offset=".45" stop-color="#15f9cd"/><stop offset="1" stop-color="#00a988"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="1" dy="6" result="offset"/><feComponentTransfer in="offset" result="fade"><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode in="fade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">BabiesIQ Music API</title>
<desc id="desc">Glossy silver and teal music note over a purple sound record, surrounded by a luminous audio orbit</desc>
<defs>
<linearGradient id="case" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#27366a"/><stop offset=".43" stop-color="#121831"/><stop offset="1" stop-color="#050a1e"/></linearGradient>
<linearGradient id="chrome" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#e4f8ff"/><stop offset=".55" stop-color="#95b3d7"/><stop offset=".83" stop-color="#e8f9ff"/><stop offset="1" stop-color="#507d9c"/></linearGradient>
<linearGradient id="teal" x1=".1" y1=".1" x2=".9" y2=".9"><stop stop-color="#bffff9"/><stop offset=".36" stop-color="#3bf7d8"/><stop offset=".65" stop-color="#00cfba"/><stop offset="1" stop-color="#147aa0"/></linearGradient>
<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6b5ff"/><stop offset=".45" stop-color="#8e7dff"/><stop offset="1" stop-color="#1bd2df"/></linearGradient>
<radialGradient id="disk" cx=".32" cy=".23" r=".88"><stop stop-color="#3c4f8f"/><stop offset=".45" stop-color="#1c2653"/><stop offset="1" stop-color="#070e23"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#080d28" flood-opacity=".58"/></filter>
</defs>
